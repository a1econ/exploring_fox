<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Page not found &ndash; exploringfox.gr</title>
<link rel="icon" href="/wp-content/uploads/2025/08/cropped-EXPLORING_FOX_NEW_LOGO-card-min-new-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/wp-content/uploads/2025/08/cropped-EXPLORING_FOX_NEW_LOGO-card-min-new-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:    #3b3663;
    --muted:  #69747f;
    --accent: #6254e7;
    --paper:  #f8f9fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .wrap { max-width: 30rem; }
  img.logo {
    width: 7rem;
    height: auto;
    margin-bottom: 2.5rem;
  }
  .code {
    font-size: clamp(4rem, 18vw, 7rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--accent);
    margin: 0;
  }
  h1 {
    font-size: clamp(1.25rem, 5vw, 1.6rem);
    font-weight: 600;
    margin: 1.25rem 0 0;
  }
  p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.65;
    margin: 0.85rem 0 2.25rem;
  }
  a.home {
    display: inline-block;
    padding: 0.9rem 2.25rem;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  a.home:hover,
  a.home:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 0.75rem 1.5rem rgba(98, 84, 231, .32);
  }
  nav {
    margin-top: 2.5rem;
    font-size: 0.9rem;
    line-height: 2.1;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    margin: 0 0.6rem;
    border-bottom: 1px solid transparent;
  }
  nav a:hover,
  nav a:focus-visible {
    color: var(--accent);
    border-bottom-color: currentColor;
  }
  @media (prefers-reduced-motion: reduce) {
    a.home { transition: none; }
    a.home:hover { transform: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/wp-content/uploads/2025/08/cropped-EXPLORING_FOX_NEW_LOGO-card-min-new-270x270.png" alt="ExploringFox">
    <p class="code">404</p>
    <h1>This page has drifted off course</h1>
    <p>The page you were looking for doesn&rsquo;t exist, or it has moved somewhere else.</p>
    <a class="home" href="/">Back to home</a>
    <nav>
      <a href="/services/">Services</a>
      <a href="/events/">Events</a>
      <a href="/photogallery/">Photo Gallery</a>
      <a href="/about-us/">About Us</a>
      <a href="/contact-us/">Contact Us</a>
    </nav>
  </main>
</body>
</html>
